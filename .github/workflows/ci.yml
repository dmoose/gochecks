name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - run: go install golang.org/x/tools/cmd/goimports@latest
      - run: test -z "$(gofmt -s -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: make check
